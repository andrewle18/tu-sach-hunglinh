name = "small-voice-4cb4"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Tự dựng kệ sách từ public/books/ trước mỗi lần deploy và chạy thử.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# Worker chỉ chạy khi không có file tĩnh khớp đường dẫn (tức là /api/message).
run_worker_first = false
